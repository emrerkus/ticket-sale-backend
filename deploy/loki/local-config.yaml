# Loki'nin minimal, tek-binary (single-process), diske yazan konfigurasyonu.
# Prod'da S3/GCS + kume modu kullanilir; burada lokal gelistirme/demo yeterli.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Uygulamamiz sadece "service" ve "event" etiketi kullaniyor (dusuk kardinalite);
  # varsayilan limitler bu ogrenme/demo projesi icin fazlasiyla yeterli.
  reject_old_samples: true
  reject_old_samples_max_age: 168h
